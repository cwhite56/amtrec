<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Druid List</title>
        <link rel="stylesheet" th:href="@{/style.css}">

    </head>

    <body>  

        <form class="form" th:action="@{/api/v1/users/{id}/spell-lists (id = ${username})}" th:object="${spelllist}" method="post">

            <div>
                <label>Title </label>
                <input type="text" th:field="*{title}" required/>
                <input type="hidden" th:field="*{user}"/>
                <input type="hidden" th:field="*{casterClass}" />
                <input type="hidden" th:field="*{archtype}" value=""/>
            </div>

            <div>
                <label>Look the part</label>
                <input type="checkbox" th:field="*{LTP}" th:id="LTP" onchange="setLTP('LTP')" value="true"/>
                
            </div>

            <div class="spell-grid">

                <h1>Level 1</h1>
                <div class="subhead subhead-name">Name</div>
                <div class="subhead subhead-purchased">Purchased</div>
                <div class="subhead subhead-cost">Cost</div>
                <div class="subhead subhead-max">Max</div>
                <div class="spell-row">
                    <label for="barkskin">Barkskin</label>
                    <input type="number" id="barkskin" class="spell-input" th:field="*{spentPoints[0]}" 
                    data-cost="1" data-cost-multiplier="1" data-limit="2" data-level="1" data-type="enchantment" data-school="protection" data-range="other" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('barkskin')" value="+"/>        
                    <input type="button" onclick="countDown('barkskin')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="entangle">Entangle</label>
                    <input type="number" id="entangle" class="spell-input" th:field="*{spentPoints[1]}" 
                    data-cost="1"  data-cost-multiplier="1" data-limit="2" data-level="1" data-type="ball" data-school="subdual" data-range="ball" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('entangle')" value="+"/>        
                    <input type="button" onclick="countDown('entangle')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="short">Weapon Short</label>
                    <input type="number" id="short" class="spell-input" th:field="*{spentPoints[2]}" 
                    data-cost="2"  data-cost-multiplier="1" data-limit="2" data-level="1" data-type="weapon" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('short')" value="+"/>        
                    <input type="button" onclick="countDown('short')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="ex-1-label">Experienced 1</label>
                    <input type="number" id="ex-1-label" class="spell-input" th:field="*{spentPoints[3]}" 
                    data-cost="2"  data-cost-multiplier="1" data-limit="1" data-level="1" data-type="neutral" data-school="neutral" 
                    data-value-multiplier="1" value="0" readonly/>     
                    <span class="blank-cell"></span>
                    <input type="button" onclick="countDown('ex-1-label'); exSpell(1, false)" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                    <div class="exp-select-cell">
                        <select th:field="*{exp1}" onchange="exSpell(1, true); countUp('ex-1-label')">
                            <option value=""> Select Spell to Experience</option>
                            <option value="mend">Mend</option>
                            <option value="heal">Heal</option>
                             <option value="release">Release</option>
                            <option value="dispel">Dispel Magic</option>
                            <option value="greater-mend">Greater Mend</option>
                            <option value="icy-blast">Icy Blast</option>
                            <option value="teleport">Teleport</option>
                        </select>
                    </div>     
                    <span class="fill-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="ex-2-label">Experienced 2</label>
                    <input type="number" id="ex-2-label" class="spell-input" th:field="*{spentPoints[4]}" 
                    data-cost="2"  data-cost-multiplier="1" data-limit="1" data-level="1" data-type="neutral" data-school="neutral" 
                    data-value-multiplier="1" value="0" readonly/>       
                    <span class="blank-cell"></span>
                    <input type="button" onclick="countDown('ex-2-label'); exSpell(2, false)" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                    <div class="exp-select-cell">
                        <select th:field="*{exp2}" onchange="exSpell(2, true); countUp('ex-2-label')">
                            <option value=""> Select Spell to Experience</option>
                            <option value="mend">Mend</option>
                            <option value="heal">Heal</option>
                             <option value="release">Release</option>
                            <option value="dispel">Dispel Magic</option>
                            <option value="greater-mend">Greater Mend</option>
                            <option value="icy-blast">Icy Blast</option>
                            <option value="teleport">Teleport</option>
                        </select>
                    </div>     
                    <span class="fill-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="heat-weapon">Heat Weapon</label>
                    <input type="number" id="heat-weapon" class="spell-input" th:field="*{spentPoints[5]}" 
                    data-cost="1" data-cost-multiplier="1" data-level="1" data-type="verbal" data-school="flame" data-range="20" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('heat-weapon')" value="+"/>        
                    <input type="button" onclick="countDown('heat-weapon')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">

                    data-cost="1" data-cost-multiplier="1" data-level="1" data-type="enchantment" data-school="protection" data-range="other" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('harden-armor')" value="+"/>        
                    <input type="button" onclick="countDown('harden-armor')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="mend">Mend</label>
                    <input type="number" id="mend" class="spell-input" th:field="*{spentPoints[7]}" 
                    data-cost="1" data-cost-multiplier="1" data-level="1" data-type="verbal" data-school="sorcery" data-range="touch" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('mend')" value="+"/>        
                    <input type="button" onclick="countDown('mend')" value="-"/>

                    <span class="limit-cell"></span>
                </div>

                   <h1>Level 2</h1>

                <div class="subhead subhead-cost">Cost</div>

                <div class="spell-row">

                    data-cost="1" data-cost-multiplier="1"  data-limit="2" data-level="2" data-type="enchantment" data-school="protection" data-range="other" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('gift-earth')" value="+"/>        
                    <input type="button" onclick="countDown('gift-earth')" value="-"/>

                </div>

                <div class="spell-row">

                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('heal')" value="+"/>

                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="subhead subhead-purchased">Purchased</div>
                <div class="subhead subhead-cost">Cost</div>

                <div class="spell-row">

                    <input type="number" id="dispel" class="spell-input" th:field="*{spentPoints[17]}" 
                    data-cost="1" data-cost-multiplier="1" data-level="3" data-type="verbal" data-school="sorcery" data-range="20"
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('dispel')" value="+"/>        
                    <input type="button" onclick="countDown('dispel')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="dragged-below">Dragged Below</label>
                    <input type="number" id="dragged-below" class="spell-input" th:field="*{spentPoints[18]}" 
                    data-cost="1" data-cost-multiplier="1"  data-level="3" data-type="verbal" data-school="death" data-range="20" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('dragged-below')" value="+"/>        
                    <input type="button" onclick="countDown('dragged-below')" value="-"/>

                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="extension">Extension</label>
                    <input type="number" id="extension" class="spell-input" th:field="*{spentPoints[19]}" 
                    data-cost="1" data-cost-multiplier="1" data-limit="2" data-level="3" data-type="meta" data-school="neutral" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('extension')" value="+"/>

                <div class="spell-row">

                    <input type="number" id="hold-person" class="spell-input" th:field="*{spentPoints[21]}" 
                    data-cost="1" data-cost-multiplier="1" data-level="3" data-type="verbal" data-school="command" data-range="20"

                    <input type="number" id="iceball" class="spell-input" th:field="*{spentPoints[22]}"

                    data-value-multiplier="1" value="0" readonly/>

                    <input type="button" onclick="countDown('iceball')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="lightning-bolt">Lightning Bolt</label>
                    <input type="number" id="lightning-bolt" class="spell-input" th:field="*{spentPoints[23]}" 
                    data-cost="1" data-cost-multiplier="1" data-limit="4" data-level="3" data-type="ball" data-school="flame" data-range="ball"
