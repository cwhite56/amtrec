<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Healer List</title>
        <link rel="stylesheet" th:href="@{/style.css}">

    </head>

    <body>  

        <form class="form" th:action="@{/api/v1/users/{id}/spell-lists (id = ${username})}" th:object="${spelllist}" method="post">

            <div>
                <label>Title </label>
                <input type="text" th:field="*{title}" required/>
                <input type="hidden" th:field="*{user}"/>
                <input type="hidden" th:field="*{casterClass}" />
                <input type="hidden" th:field="*{archtype}" value=""/>
            </div>

            <div>
                <label>Look the part</label>
                <input type="checkbox" th:field="*{LTP}" th:id="LTP" onchange="setLTP('LTP')" value="true"/>
                
            </div>

            <div class="spell-grid">

                <h1>Level 1</h1>
                <div class="subhead subhead-name">Name</div>
                <div class="subhead subhead-purchased">Purchased</div>
                <div class="subhead subhead-cost">Cost</div>
                <div class="subhead subhead-max">Max</div>

               <div class="spell-row">
                    <label for="banish">Banish</label>
                    <input type="number" id="banish" class="spell-input" th:field="*{spentPoints[0]}" 
                    data-cost="1" data-level="1" data-type="verbal" data-school="spirit" data-range="20" data-purchased="0" value="0" readonly/>
                    <input type="button" onclick="countUp('banish')" value="+"/>        
                    <input type="button" onclick="countDown('banish')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="blessing-wounds">Blessing Against Wounds</label>
                    <input type="number" id="blessing-wounds" class="spell-input" th:field="*{spentPoints[1]}" 
                    data-cost="1"  data-level="1" data-type="enchantment" data-school="protection" data-range="other" data-purchased="0" value="0" readonly/>
                    <input type="button" onclick="countUp('blessing-wounds')" value="+"/>        
                    <input type="button" onclick="countDown('blessing-wounds')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="small">Shield Small</label>
                    <input type="number" id="small" class="spell-input" th:field="*{spentPoints[2]}" 
                    data-cost="2"  data-limit="1" data-level="1" data-type="weapon" data-purchased="0" value="0" readonly/>
                    <input type="button" onclick="countUp('small')" value="+"/>        
                    <input type="button" onclick="countDown('small')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                 <div class="spell-row">
                    <label for="short">Weapon Short</label>
                    <input type="number" id="short" class="spell-input" th:field="*{spentPoints[3]}" 
                    data-cost="3"  data-limit="2" data-level="1" data-type="weapon" data-purchased="0" value="0" readonly/>
                    <input type="button" onclick="countUp('short')" value="+"/>        
                    <input type="button" onclick="countDown('short')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="ex-1-label">Experienced 1</label>
                    <input type="number" id="ex-1-label" class="spell-input" th:field="*{spentPoints[4]}" 
                    data-cost="2"  data-limit="1" data-level="1" data-type="neutral" data-school="neutral" data-purchased="0" value="0" readonly/>     
                    <span class="blank-cell"></span>
                    <input type="button" onclick="countDown('ex-1-label'); exSpell(1, false)" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                    <div class="exp-select-cell">
                        <select th:field="*{exp1}" onchange="exSpell(1, true); countUp('ex-1-label')">
                            <option value=""> Select Spell to Experience</option>
                            <option value="banish">Banish</option>
                            <option value="greater-release">Greater Release</option>
                            <option value="shove">Shove</option>
                            <option value="mend">Mend</option>
                            <option value="raise-dead">Raise Dead</option>
                            <option value="greater-heal">Greater Heal</option>
                            <option value="teleport">Teleport</option>
                            <option value="dispel">Dispel Magic</option>
                        </select>
                    </div>     
                    <span class="fill-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="ex-2-label">Experienced 2</label>
                    <input type="number" id="ex-2-label" class="spell-input" th:field="*{spentPoints[5]}"

                    <span class="limit-cell"></span>

                            <option value="shove">Shove</option>
                            <option value="mend">Mend</option>
                            <option value="raise-dead">Raise Dead</option>
                            <option value="greater-heal">Greater Heal</option>
                            <option value="teleport">Teleport</option>
                            <option value="dispel">Dispel Magic</option>

        <script type="text/javascript" th:src="@{/js/listBuilder.js}"></script>

        <script>
        function setNecromancer(bool) {

            const spellInputs = document.querySelectorAll('.spell-input');

            if(bool) {
                for(const spell of spellInputs) {

                    if(spell.dataset.school == "protection" && spell.value > 0) return -1;
                }
                setArchtype('necromancer');
                countUp('necromancer');
            }
            else {
                setArchtype('');
                countDown('necromancer')
            }
        }

        function setPriest(bool) {
            const heal = document.getElementById('heal');
            if(bool) {
                countDown(heal.id);
                setArchtype('priest');
                countUp(heal.id);
                countUp('priest');
            }

            else {
                countDown(heal.id);
                setArchtype('');
                countUp(heal.id);
                countDown('priest')
            }
        }

        function setWarder(bool) {
            const spellInputs = document.querySelectorAll('.spell-input');

            if(bool) {
                // Check for violations
                for(const spell of spellInputs) {
                    if((spell.dataset.school == "death" || spell.dataset.school == "command" || spell.dataset.school == "subdual") && spell.value > 0)return -1;
                }

                if(countUp('warder') < 0) return -1;
                setArchtype('warder');

                for(const spell of spellInputs) {
                    if(spell.dataset.school == "protection") {

                        const multipliers = getArchtypeMultipliers(spell.id);
                        spell.value *= multipliers.value;
                    }
                }
            }
            else {
                countDown('warder');
                setArchtype('');
                for(const spell of spellInputs) {
                    if(spell.dataset.school =="protection") {

                        const multipliers = getArchtypeMultipliers(spell.id);
                        spell.value /= multipliers.value;
                    }
                }
            }
        }
        </script>
