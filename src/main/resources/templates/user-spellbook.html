<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Spell Lists</title>
    </head>

    <body>
        <header th:text="${username} + '\'s ' + 'Spell ' + 'Lists'"> </header>

        <div>
            <a th:href="@{/users/{username}/dashboard(username = ${username})}" dashboard>
            My Dashboard
            </a>
        </div>
        
        <div>
            <ul>
                <li th:each="spelllist : ${dtoList}">
                    <a th:href="@{/users/{username}/spell-lists/{title}/builder(username = ${username}, title = ${spelllist.title})}" 
                    th:text="${spelllist.title}" Spell List Title>
                    </a>
                </li>
            </ul>
        </div>

        <div>
            <a th:href="@{/users/{username}/spell-lists/class-selection-build(username = ${username})}">
                Create new spell list
            </a>
        </div>
    </body>
    <style>
        * {
            text-align: center;
        }
        header{
            font-size: 30px;
            font-weight: bold;
            padding-top: 80px;
            padding-bottom: 80px;
        }
        
        body{
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 10px solid blueviolet;
            font-size: 20px;
            background-color: rgb(235, 228, 128);
        }
    </style>




</html>
