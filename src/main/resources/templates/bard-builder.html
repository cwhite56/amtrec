<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Bard List</title>
        <link rel="stylesheet" th:href="@{/style.css}">

    </head>

    <body>  

        <form class="form" th:action="@{/api/v1/users/{id}/spell-lists (id = ${username})}" th:object="${spelllist}" method="post">

            <div>
                <label>Title </label>
                <input type="text" th:field="*{title}" required/>
                <input type="hidden" th:field="*{user}"/>
                <input type="hidden" th:field="*{casterClass}" />
                <input type="hidden" th:field="*{archtype}" value=""/>
            </div>

            <div>
                <label>Look the part</label>
                <input type="checkbox" th:field="*{LTP}" th:id="LTP" onchange="setLTP('LTP')" value="true"/>
                
            </div>

            <div class="spell-grid">

                <h1>Level 1</h1>
                <div class="subhead subhead-name">Name</div>
                <div class="subhead subhead-purchased">Purchased</div>
                <div class="subhead subhead-cost">Cost</div>
                <div class="subhead subhead-max">Max</div>
                <div class="spell-row">
                    <label for="confidence">Confidence</label>
                    <input type="number" id="confidence" class="spell-input" th:field="*{spentPoints[0]}" 
                    data-cost="1" data-cost-multiplier="1" data-level="1" data-type="verbal" data-school="sorcery" data-range="other" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('confidence')" value="+"/>        
                    <input type="button" onclick="countDown('confidence')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="short">Weapon Short</label>
                    <input type="number" id="short" class="spell-input" th:field="*{spentPoints[1]}" 
                    data-cost="2"  data-cost-multiplier="1" data-limit="2" data-level="1" data-type="weapon" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('short')" value="+"/>        
                    <input type="button" onclick="countDown('short')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="ex-1-label">Experienced 1</label>
                    <input type="number" id="ex-1-label" class="spell-input" th:field="*{spentPoints[2]}" 
                    data-cost="2"  data-cost-multiplier="1" data-limit="1" data-level="1" data-type="neutral" data-school="neutral" 
                    data-value-multiplier="1" value="0" readonly/>     
                    <span class="blank-cell"></span>
                    <input type="button" onclick="countDown('ex-1-label'); exSpell(1, false)" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                    <div class="exp-select-cell">
                        <select th:field="*{exp1}" onchange="exSpell(1, true); countUp('ex-1-label')">
                            <option value=""> Select Spell to Experience</option>
                            <option value="insult">Insult</option>
                            <option value="release">Release</option>
                            <option value="shove">Shove</option>
                            <option value="empower">Empower</option>
                            <option value="greater-release">Greater Release</option>
                            <option value="mend">Mend</option>
                            <option value="awe">Awe</option>
                            <option value="break-con">Break Concentration</option>
                            <option value="restoration">Restoration</option>
                            <option value="suppress-aura">Suppress Aura</option>
                            <option value="terror">Terror</option>
                        </select>
                    </div>     
                    <span class="fill-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="ex-2-label">Experienced 2</label>
                    <input type="number" id="ex-2-label" class="spell-input" th:field="*{spentPoints[3]}" 
                    data-cost="2"  data-cost-multiplier="1" data-limit="1" data-level="1" data-type="neutral" data-school="neutral" 
                    data-value-multiplier="1" value="0" readonly/>       
                    <span class="blank-cell"></span>
                    <input type="button" onclick="countDown('ex-2-label'); exSpell(2, false)" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                    <div class="exp-select-cell">
                        <select th:field="*{exp2}" onchange="exSpell(2, true); countUp('ex-2-label')">
                            <option value=""> Select Spell to Experience</option>
                            <option value="insult">Insult</option>
                            <option value="release">Release</option>
                            <option value="shove">Shove</option>
                            <option value="empower">Empower</option>
                            <option value="greater-release">Greater Release</option>
                            <option value="mend">Mend</option>
                            <option value="awe">Awe</option>
                            <option value="break-con">Break Concentration</option>
                            <option value="restoration">Restoration</option>
                            <option value="suppress-aura">Suppress Aura</option>
                            <option value="terror">Terror</option>
                        </select>
                    </div>     
                    <span class="fill-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="insult">Insult</label>
                    <input type="number" id="insult" class="spell-input" th:field="*{spentPoints[4]}" 
                    data-cost="1" data-cost-multiplier="1" data-level="1" data-type="verbal" data-school="command" data-range="20" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('insult')" value="+"/>        
                    <input type="button" onclick="countDown('insult')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="release">Release</label>
                    <input type="number" id="release" class="spell-input" th:field="*{spentPoints[5]}" 
                    data-cost="1" data-cost-multiplier="1" data-level="1" data-type="verbal" data-school="sorcery" data-range="touch" 
                    data-value-multiplier="1" value="0" readonly/>

                    <input type="button" onclick="countDown('release')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="shove">Shove</label>
                    <input type="number" id="shove" class="spell-input" th:field="*{spentPoints[6]}" 
                    data-cost="1" data-cost-multiplier="1" data-level="1" data-type="verbal" data-school="sorcery" data-range="20" 
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('shove')" value="+"/>        
                    <input type="button" onclick="countDown('shove')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="song-determination">Song of Determination</label>
                    <input type="number" id="song-determination" class="spell-input" th:field="*{spentPoints[7]}" 
                    data-cost="1" data-cost-multiplier="1" data-limit="1" data-level="1" data-type="enchantment" data-school="protection" data-range="self" 
                    data-value-multiplier="1" value="0" readonly/>

                    <input type="button" onclick="countDown('song-determination')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <h1>Level 2</h1>
                <div class="subhead subhead-name">Name</div>
                <div class="subhead subhead-purchased">Purchased</div>
                <div class="subhead subhead-cost">Cost</div>
                <div class="subhead subhead-max">Max</div>

                <div class="spell-row">

                <div class="spell-row">

                    <input type="button" onclick="countDown('greater-release')" value="-"/>

                </div>

                <div class="spell-row">
                    <label for="inate">Inate</label>

                    data-value-multiplier="1" value="0" readonly/>

                    <input type="button" onclick="countDown('inate')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">

                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('battlefield-triage')" value="+"/>        
                    <input type="button" onclick="countDown('battlefield-triage')" value="-"/>

                    <span class="limit-cell"></span>
                </div>


                <div class="spell-row">
                    <label for="break-con">Break Concentration</label>
                    <input type="number" id="break-con" class="spell-input" th:field="*{spentPoints[17]}" 
                    data-cost="1" data-cost-multiplier="1" data-limit="4" data-level="3" data-type="verbal" data-school="command" data-range="20"
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('break-con')" value="+"/>        
                    <input type="button" onclick="countDown('break-con')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="extension">Extension</label>
                    <input type="number" id="extension" class="spell-input" th:field="*{spentPoints[18]}" 
                    data-cost="1" data-cost-multiplier="1"  data-limit="2" data-level="3" data-type="meta" data-school="neutral"
                    data-value-multiplier="1" value="0" readonly/>
                    <input type="button" onclick="countUp('extension')" value="+"/>        
                    <input type="button" onclick="countDown('extension')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="small">Shield Small</label>
                    <input type="number" id="small" class="spell-input" th:field="*{spentPoints[19]}" 
                    data-cost="2" data-cost-multiplier="1" data-limit="1" data-level="3" data-type="weapon"
                    data-value-multiplier="1" value="0" readonly/>

                    <input type="number" id="song-freedom" class="spell-input" th:field="*{spentPoints[20]}" 
                    data-cost="1" data-cost-multiplier="1" data-limit="1" data-level="3" data-type="enchantment" data-school="protection" data-range="self"

                </div>

                <div class="subhead subhead-purchased">Purchased</div>
                <div class="subhead subhead-cost">Cost</div>

                <div class="spell-row">
                    <label for="amplification">Amplification</label>
                    <input type="number" id="amplification" class="spell-input" th:field="*{spentPoints[21]}" 
                    data-cost="1" data-cost-multiplier="1" data-limit="4" data-level="4" data-type="enchantment" data-school="sorcery" data-range="touch"
                    data-value-multiplier="1" value="0" readonly/>

                <div class="spell-row">

        <script type="text/javascript" th:src="@{/js/listBuilder.js}"></script>

        <script>
           function setCombatCaster(bool) {
            if(bool) {
                setArchtype('combat-caster');
                countUp('combat-caster');
            }
            else {
                setArchtype('');
                countDown('combat-caster');
            }
           }

           function setDervish(bool) {
            
            const spellInputs = document.querySelectorAll('.spell-input');

            if(bool) {
                for(const spell of spellInputs) {

                    if(spell.dataset.type == "verbal") {

                        spell.dataset.valueMultiplier = 2;
                        spell.value *= parseInt(spell.dataset.valueMultiplier);
                    }

                    else if(spell.dataset.type == "weapon") {

                        for(let i = 0; i < spell.value; i++) {
                            refundPoints(spell);
                        }
                        spell.dataset.costMultiplier = 2;

                        for(let i = 0; i < spell.value; i++) {
                            if(spendPoints(spell) < 0) return -1;
                        }
                        
                    }
                }
                setArchtype('dervish');
                countUp('dervish');
            }

            else {
                for(const spell of spellInputs) {

                    if(spell.dataset.type =="verbal") {

                        spell.value /= parseInt(spell.dataset.valueMultiplier);
                        spell.dataset.valueMultiplier = 1;
                    }

                    else if(spell.dataset.type =="weapon") {

                        for(let i = 0; i < spell.value; i++) {
                            refundPoints(spell);
                        }
                        spell.dataset.costMultiplier = 1;

                        for(let i = 0; i < spell.value; i++) {
                            spendPoints(spell);
                        }
                        
                    }
                }
                setArchtype('');
                countDown('dervish');
            }
           }
        </script>
