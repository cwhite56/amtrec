<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Wizard List</title>
    </head>

    <body>  

        <form class="form" th:action="@{/api/v1/users/{id}/spell-lists (id = ${username})}" th:object="${spelllist}" method="post">

            <div>
                <label>Title </label>
                <input type="text" th:field="*{title}" required/>
                <input type="hidden" th:field="*{user}"/>
                <input type="hidden" th:field="*{casterClass}" />
            </div>

            <div>
                <label>Look the part</label>
                <input type="checkbox" th:field="*{LTP}" onchange="LTP('LTPSet')" value="true"/>
                
            </div>

            <h1>Level 1</h1>
            <h2>Name    Purchased   Cost    Max</h2>
            <div>
                <label for="banish">Banish</label>
                <input type="number" id="banish" class="spell-input" th:field="*{spentPoints[0]}" data-cost="1" data-level="1" value="0" readonly/>
                <input type="button" onclick="countUp('banish')" value="+"/>        
                <input type="button" onclick="countDown('banish')" value="-"/>      
            </div>

            <div>
                <label for="short">Weapon Short</label>
                <input type="number" id="short" class="spell-input" th:field="*{spentPoints[1]}" data-cost="2"  data-limit="1" data-level="1" value="0" readonly/>
                <input type="button" onclick="countUp('short')" value="+"/>        
                <input type="button" onclick="countDown('short')" value="-"/>
            </div>

            <div>
                <label for="ex-1-label">Experienced 1</label>
                <input type="number" id="ex-1-label" class="spell-input" th:field="*{spentPoints[2]}" data-cost="2"  data-limit="1" data-level="1" value="0" readonly/>     
                <input type="button" onclick="countDown('ex-1-label'); exSpell(1, false)" value="-"/>
                <div>
                    <select th:field="*{exp1}" onchange="exSpell(1, true); countUp('ex-1-label')">
                        <option value=""> Select Spell to Experience</option>
                        <option value="banish">Banish</option>
                        <option value="force-barrier">Force Barrier</option>
                        <option value="heat-weapon">Heat Weapon</option>
                        <option value="mend">Mend</option>
                        <option value="shove">Shove</option>
                    </select>
                </div>     
            </div>

            <div>
                <label for="ex-2-label">Experienced 2</label>
                <input type="number" id="ex-2-label" class="spell-input" th:field="*{spentPoints[3]}" data-cost="2"  data-limit="1" data-level="1" value="0" readonly/>       
                <input type="button" onclick="countDown('ex-2'); exSpell(2, false)" value="-"/>
                <div>
                    <select th:field="*{exp2}" onchange="exSpell(2, true); countUp('ex-2-label')">
                        <option value=""> Select Spell to Experience</option>
                        <option value="banish">Banish</option>
                        <option value="force-barrier">Force Barrier</option>
                        <option value="heat-weapon">Heat Weapon</option>
                        <option value="mend">Mend</option>
                        <option value="shove">Shove</option>
                    </select>
                </div>     
            </div>

            <div>
                <label for="force-barrier">Force Barrier</label>
                <input type="number" id="force-barrier" class="spell-input" th:field="*{spentPoints[4]}" data-cost="1" data-level="1" value="0" readonly/>
                <input type="button" onclick="countUp('force-barrier')" value="+"/>        
                <input type="button" onclick="countDown('force-barrier')" value="-"/>
            </div>

             <div>
                <label for="force-bolt">Force Bolt</label>
                <input type="number" id="force-bolt" class="spell-input" th:field="*{spentPoints[5]}" data-cost="1" data-limit="8" data-level="1" value="0" readonly/>
                <input type="button" onclick="countUp('force-bolt')" value="+"/>        
                <input type="button" onclick="countDown('force-bolt')" value="-"/>
            </div>

             <div>
                <label for="heat-weapon">Heat Weapon</label>
                <input type="number" id="heat-weapon" class="spell-input" th:field="*{spentPoints[6]}" data-cost="1" data-level="1" value="0" readonly/>
                <input type="button" onclick="countUp('heat-weapon')" value="+"/>        
                <input type="button" onclick="countDown('heat-weapon')" value="-"/>
            </div>

             <div>
                <label for="mend">Mend</label>
                <input type="number" id="mend" class="spell-input" th:field="*{spentPoints[7]}" data-cost="1" data-level="1" value="0" readonly/>
                <input type="button" onclick="countUp('mend')" value="+"/>        
                <input type="button" onclick="countDown('mend')" value="-"/>
            </div>

             <div>
                <label for="shove">Shove</label>
                <input type="number" id="shove" class="spell-input" th:field="*{spentPoints[8]}" data-cost="1" data-level="1" value="0" readonly/>
                <input type="button" onclick="countUp('shove')" value="+"/>        
                <input type="button" onclick="countDown('shove')" value="-"/>
            </div>
            <h1>Level 2</h1>
            <h2>Name    Purchased   Cost    Max</h2>



            <div id="form-footer">
                <span id="reqLevel1">1:</span><input type="number" id="level1Points" name="level1Points"  class="level-input" th:field="*{pointsRemainingByLevel[0]}" value="5" size="2" disabled > 
                <span id="reqLevel2">2:</span><input type="number" id="level2Points" name="level2Points"  class="level-input" th:field="*{pointsRemainingByLevel[1]}" value="5" size="2" disabled > 
                <span id="reqLevel3">3:</span><input type="number" id="level3Points" name="level3Points"  class="level-input" th:field="*{pointsRemainingByLevel[2]}" value="5" size="2" disabled > 
                <span id="reqLevel4">4:</span><input type="number" id="level4Points" name="level4Points"  class="level-input" th:field="*{pointsRemainingByLevel[3]}" value="5" size="2" disabled > 
                <span id="reqLevel5">5:</span><input type="number" id="level5Points" name="level5Points"  class="level-input" th:field="*{pointsRemainingByLevel[4]}" value="5" size="2" disabled > 
                <span id="reqLevel6">6:</span><input type="number" id="level6Points" name="level6Points"  class="level-input" th:field="*{pointsRemainingByLevel[5]}" value="5" size="2" disabled > 
            </div>

            <div>
                <button type="submit"> Save list </button>
                <input type="button" onclick="deleteList()" value="Delete list"/>
            </div>

        </form>

        
        
        
        <script>
            function countUp(spell) {

                const inputField = document.getElementById(spell);

                if(parseInt(inputField.value) + 1 > parseInt(inputField.dataset.limit)) return;

                const levelPoints = document.querySelectorAll('[id^="level"]');

                let cost = inputField.dataset.cost;

                const spellLevel = inputField.dataset.level;


                for(let i = 0; i < 6; i++) {

                    if(i + 1 < spellLevel) continue;

                    if(levelPoints[i].value == 0) continue;

                    const startingVal = levelPoints[i].value;

                    while(levelPoints[i].value > 0  && cost > 0) {

                        levelPoints[i].value--;
                        cost--;
                    }

                    if(cost == 0) break;

                    // Not enough points remaining
                    else if(cost > 0 && i == 5) {

                        levelPoints[i].value = startingVal;

                        return;
                    }
                }

                if(cost > 0) return;

                inputField.value++;
            }

            function countDown(spell) {
                const inputField = document.getElementById(spell);

                let val = parseInt(inputField.value);

                if(val <= 0) {
                    return;
                }

                const levelPoints = document.querySelectorAll('[id^="level"]');

                let cost = inputField.dataset.cost;

                for (let i = 5; i >= 0; i--) {

                    if(levelPoints[i].value >= 5) continue;

                    while(levelPoints[i].value < 5 && cost > 0) {
                        levelPoints[i].value++;
                        cost--;
                        
                        //Level 6 gets an extra point for LTP bonus
                        if(i == 5 && cost > 0) {
                            levelPoints[i].value++;
                            cost--;
                        }
                    }

                    if(cost == 0) break;

                }

                inputField.value--;
            }

            function LTP(checkboxId) {

                const checkbox = document.getElementById(checkboxId);

                if(freshList()) {

                    const level6 = document.getElementById('level6Points');
                    
                    if(checkbox.checked) level6.value++;

                    else level6.value--;
                }
            }

            function freshList() {

                const levelPoints = document.querySelectorAll('[id^="level"]');

                for(let i = 0; i < 6; i++) {
                    if(levelPoints[i].value != 5 && levelPoints[i].value != 6) return false;
                }

                return true;
            }

            function deleteList() {

                const titleField = document.getElementById('title');
                const title = titleField.value;

                const userField = document.getElementById('user');
                const user = userField.value;

                fetch(`/api/v1/users/${user}/spell-lists/${title}`,{
                    method: 'DELETE'
                }).then(res => {

                    if(!res.ok) {
                        throw new Error("Error: could not delete spell list");
                    }
                    return res.json;

                }).then(data => {
                    window.location.href = `/users/${user}/spell-lists/dashboard`;
                });

            }

            function exSpell(exNum, isEx) {
                
                let spell;
                let sel;

                if(exNum == 1) {
                    sel = document.getElementById('exp1');
                    spell = sel.value;
                }
                else if (exNum == 2){
                    sel = document.getElementById('exp2');
                    spell = sel.value;
                }
                
                const spellLabel = document.querySelector(`label[for="${spell}"]`);

                if(isEx) {

                spellLabel.textContent += ' (ex)';  
                sel.disabled = true;

                }
                
                else {
                    spellLabel.textContent = spellLabel.textContent.replace(/\s*\(ex\)/i, '');

                    sel.disabled = false;
                    sel.selectedIndex = 0;
                }
            }
        
            const form = document.querySelector('.form');

            form.addEventListener('submit', event => {
                event.preventDefault();

                const data = Object.fromEntries(new FormData(form));

                const spellInputs = document.querySelectorAll('.spell-input');
                data.spentPoints = Array.from(spellInputs).map(input => parseInt(input.value) || 0);

                const pointsPerLevel = document.querySelectorAll('.level-input');
                data.pointsRemainingByLevel = Array.from(pointsPerLevel).map(input => parseInt(input.value));

                const exp1Select = document.getElementById('exp1');
                data.exp1 = exp1Select.value;

                const exp2Select = document.getElementById('exp2');
                data.exp2 = exp2Select.value;
        

                const username = data.user;


                fetch(`/api/v1/users/${username}/spell-lists`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)

                }).then(res =>  {

                    if(!res.ok) {

                        throw new Error('Error: could not save spell list');
                    }
                    return res.json();

                }).then(data => {
                    window.location.href = `/users/${username}/spell-lists/dashboard`;
                });
            });


                const sel1 = document.getElementById('exp1');

                if(sel1.value != '') sel1.disabled = true;
            
                const sel2 = document.getElementById('exp2');

                if(sel2.value != '') sel2.disabled = true;

        
        </script>
    </body>




</html>
