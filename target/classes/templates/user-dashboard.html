<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Dashboard</title>
    </head>

    <body>
        <header th:text="'Hello ' + ${username} + '!'"> </header>

        <div>
            <a th:href="@{/users/{name}/spell-lists/dashboard(name = ${username})}">
                My spell lists
            </a>
        </div>

        <div>
            <a th:href="@{/users/{username}/spell-lists(username = ${username})}">
                Create new spell list
            </a>
        </div>

        <div>
            Global stats
        </div>

    </body>

    <style>
            * {
                text-align: center;
                font-size: 20px;
                background-color: rgb(235, 228, 128);

            }
            body{
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                border: 10px solid blueviolet;
            }
            header{
                padding-top: 100px;
            }
            div{
                padding-top: 40px;
                padding-bottom: 40px;
            }
        </style>



</html>
