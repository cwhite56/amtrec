<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Wizard List</title>
        <link rel="stylesheet" th:href="@{/style-builder.css}">

    </head>

    <body>  

        <div>
            <a style="display: inline-block; padding-bottom: 20px; padding-top: 40px;" th:href="@{/users/{username}/dashboard(username = ${username})}">
            My Dashboard
            </a>
        </div>
        
        <form class="form" th:action="@{/api/v1/users/{id}/spell-lists (id = ${username})}" th:object="${spelllist}" method="post">

            <div>
                <label>Title </label>
                <input type="text" th:field="*{title}" required/>
                <input type="hidden" th:field="*{user}"/>
                <input type="hidden" th:field="*{casterClass}" />
                <input type="hidden" id="AT1" th:field="*{archtypes[0]}" value=""/>
                <input type="hidden" id="AT2" th:field="*{archtypes[1]}" value=""/>
                <input type="hidden" id="AT3" th:field="*{archtypes[2]}" value=""/>
            </div>

            <div>
                <label>Look the part</label>
                <input type="checkbox" th:field="*{LTP}" th:id="LTP" onchange="setLTP('LTP')" value="true"/>
                
            </div>

            <div class="spell-grid">

                <h1>Level 1</h1>
                <div class="subhead subhead-name">Name</div>
                <div class="subhead subhead-purchased">Purchased</div>
                <div class="subhead subhead-cost">Cost</div>
                <div class="subhead subhead-max">Max</div>

                <div class="spell-row">
                    <label for="banish">Banish</label>
                    <input type="number" id="banish" class="spell-value" th:field="*{spentPoints[0]}" 
                    data-cost="1" data-level="1" data-type="verbal" data-school="spirit" data-range="20" data-purchased="0" value="0" readonly/>
                    <input type="hidden" id="banish-purchased" class="spell-purchased" value="0" th:field="*{purchasedSpells[0]}"/>
                    <input type="button" onclick="countUp('banish')" value="+"/>        
                    <input type="button" onclick="countDown('banish')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="short">Weapon Short</label>
                    <input type="number" id="short" class="spell-value" th:field="*{spentPoints[1]}" 
                    data-cost="2" data-limit="1" data-level="1" data-type="weapon" data-purchased="0" value="0" readonly/>
                    <input type="hidden" id="short-purchased" class="spell-purchased" value="0" th:field="*{purchasedSpells[1]}"/>
                    <input type="button" onclick="countUp('short')" value="+"/>        
                    <input type="button" onclick="countDown('short')" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="ex-1-label">Experienced 1</label>
                    <input type="number" id="ex-1-label" class="spell-value" th:field="*{spentPoints[2]}" 
                    data-cost="2" data-limit="1" data-level="1" data-type="neutral" data-school="neutral" data-purchased="0" value="0" readonly/>     
                    <input type="hidden" id="ex-1-label-purchased" class="spell-purchased" value="0" th:field="*{purchasedSpells[2]}"/>
                    <span class="blank-cell"></span>
                    <input type="button" onclick="countDown('ex-1-label'); exSpell(1, false)" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                    <div class="exp-select-cell">
                        <select th:field="*{exp1}" onchange="exSpell(1, true); countUp('ex-1-label')">
                            <option value=""> Select Spell to Experience</option>
                            <option value="banish">Banish</option>
                            <option value="force-barrier">Force Barrier</option>
                            <option value="heat-weapon">Heat Weapon</option>
                            <option value="mend">Mend</option>
                            <option value="astral-intervention">Astral Intervention</option>
                            <option value="break-con">Break Concentration</option>
                            <option value="planar-grounding">Planar Grounding</option>
                            <option value="release">Release</option>
                            <option value="teleport">Teleport</option>
                            <option value="dragged-below">Dragged Below</option>
                            <option value="greater-mend">Greater Mend</option>
                            <option value="hold-person">Hold Person</option>
                            <option value="ravage">Ravage</option>
                            <option value="shatter-weapon">Shatter Weapon</option>
                            <option value="throw">Throw</option>
                            <option value="destroy-armor">Destroy Armor</option>
                            <option value="d-rift">Dimensional Rift</option>
                            <option value="icy-blast">Icy Blast</option>
                            <option value="shatter">Shatter</option>
                            <option value="suppress-aura">Suppress Aura</option>
                        </select>
                    </div>     
                    <span class="fill-cell"></span>
                </div>

                <div class="spell-row">
                    <label for="ex-2-label">Experienced 2</label>
                    <input type="number" id="ex-2-label" class="spell-value" th:field="*{spentPoints[3]}" 
                    data-cost="2" data-limit="1" data-level="1" data-type="neutral" data-school="neutral" data-purchased="0" value="0" readonly/>       
                    <input type="hidden" id="ex-2-label-purchased" class="spell-purchased" value="0" th:field="*{purchasedSpells[3]}"/>
                    <span class="blank-cell"></span>
                    <input type="button" onclick="countDown('ex-2-label'); exSpell(2, false)" value="-"/>
                    <span class="cost-cell"></span>
                    <span class="limit-cell"></span>
                    <div class="exp-select-cell">
                        <select th:field="*{exp2}" onchange="exSpell(2, true); countUp('ex-2-label')">
                            <option value=""> Select Spell to Experience</option>
                            <option value="banish">Banish</option>
                            <option value="force-barrier">Force Barrier</option>
                            <option value="heat-weapon">Heat Weapon</option>
                            <option value="mend">Mend</option>
                            <option value="teleport">Teleport</option>
                            <option value="dragged-below">Dragged Below</option>
                            <option value="greater-mend">Greater Mend</option>
                            <option value="hold-person">Hold Person</option>
                            <option value="ravage">Ravage</option>
                            <option value="shatter-weapon">Shatter Weapon</option>
                            <option value="throw">Throw</option>
                            <option value="destroy-armor">Destroy Armor</option>
                            <option value="d-rift">Dimensional Rift</option>
                            <option value="icy-blast">Icy Blast</option>
                            <option value="shatter">Shatter</option>
                            <option value="suppress-aura">Suppress Aura</option>
                        </select>
                    </div>     
                    <span class="fill-cell"></span>
                </div>

                    <input type="hidden" id="force-barrier-purchased" class="spell-purchased" value="0" th:field="*{purchasedSpells[4]}"/>
                    <input type="button" onclick="countUp('force-barrier')" value="+"/>

        <script>
            function setBattlemage(bool) {
                const spellInputs = document.querySelectorAll('.spell-value');

                if(bool) {
                
                    for(const spell of spellInputs) {
                        
                        if(spell.dataset.type == "ball" || spell.dataset.type == "enchantment") {

                            if(parseInt(spell.value) > 0) return;
                        }
                    }
                    setArchtype('battlemage', 0);
                    countUp('battlemage');
                }
                else {
                    setArchtype('', 0);
                    countDown('battlemage');
                }
            }



            function setEvoker(bool) {

                if(bool) {
                    const spellInputs = document.querySelectorAll('.spell-value');
                    
                    for(const spell of spellInputs) {
                        
                        if(spell.dataset.range == "20" || spell.dataset.range == "50") {

                            if(parseInt(spell.value) > 0) return;
                        }
                    }
                    countUp('evoker');
                    setArchtype('evoker', 1);
                }
                else {
                    countDown('evoker');
                    setArchtype('', 1);
                }

            }

            function setWarlock(bool) {

                const spellInputs = document.querySelectorAll('.spell-value');

                if(bool) {
                    
                    for(const spell of spellInputs) {
                        // check for violations
                        if(spell.dataset.school != "death" && spell.dataset.school != "flame") {

                            if( (spell.dataset.type == "verbal" || spell.dataset.type == "ball") && parseInt(spell.value) > 0) return -1; 
                        }
                    }
                    if(countUp('warlock') < 0) return -1;
                    setArchtype('warlock', 2);

                    for(const spell of spellInputs) {
                        if(spell.dataset.school == "death" || spell.dataset.school == "flame") {

                            const multipliers = getArchtypeMultipliers(spell.id);
                            spell.value *= multipliers.value;
                        }
                    }
                }

                else {
                    for(const spell of spellInputs) {
                        if(spell.dataset.school == "death" || spell.dataset.school == "flame") {
                            
                            const multipliers = getArchtypeMultipliers(spell.id);
                            spell.value /= multipliers.value;
                        }
                    }
                    countDown('warlock');
                    setArchtype('', 2);
                }
            }
        </script>
