<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Wizard List</title>
    </head>

    <body>  

        <form class="form" th:action="@{/api/v1/users/{id}/spell-lists (id = ${username})}" th:object="${spelllist}" method="post">

            <div>
                <label>Title </label>
                <input type="text" th:field="*{title}" required/>
                <input type="hidden" th:field="*{user}"/>
                <input type="hidden" th:field="*{casterClass}" />
                <input type="hidden" th:field="*{archtype}" value=""/>
            </div>

            <div>
                <label>Look the part</label>
                <input type="checkbox" th:field="*{LTP}" th:id="LTP" onchange="setLTP('LTP')" value="true"/>
                
            </div>

            <h1>Level 1</h1>
            <h2>Name    Purchased   Cost    Max</h2>
            <div>
                <label for="banish">Banish</label>
                <input type="number" id="banish" class="spell-input" th:field="*{spentPoints[0]}" 
                data-cost="1" data-level="1" data-type="verbal" data-school="spirit" data-range="20" value="0" readonly/>
                <input type="button" onclick="countUp('banish')" value="+"/>        
                <input type="button" onclick="countDown('banish')" value="-"/>      
            </div>

            <div>
                <label for="short">Weapon Short</label>
                <input type="number" id="short" class="spell-input" th:field="*{spentPoints[1]}" 
                data-cost="2"  data-limit="1" data-level="1" data-type="neutral" value="0" readonly/>
                <input type="button" onclick="countUp('short')" value="+"/>        
                <input type="button" onclick="countDown('short')" value="-"/>
            </div>

            <div>
                <label for="ex-1-label">Experienced 1</label>
                <input type="number" id="ex-1-label" class="spell-input" th:field="*{spentPoints[2]}" 
                data-cost="2"  data-limit="1" data-level="1" data-type="neutral" data-school="neutral" value="0" readonly/>     
                <input type="button" onclick="countDown('ex-1-label'); exSpell(1, false)" value="-"/>
                <div>
                    <select th:field="*{exp1}" onchange="exSpell(1, true); countUp('ex-1-label')">
                        <option value=""> Select Spell to Experience</option>
                        <option value="banish">Banish</option>
                        <option value="force-barrier">Force Barrier</option>
                        <option value="heat-weapon">Heat Weapon</option>
                        <option value="mend">Mend</option>
                        <option value="shove">Shove</option>
                    </select>
                </div>     
            </div>

            <div>
                <label for="ex-2-label">Experienced 2</label>
                <input type="number" id="ex-2-label" class="spell-input" th:field="*{spentPoints[3]}" 
                data-cost="2"  data-limit="1" data-level="1" data-type="neutral" data-school="neutral" value="0" readonly/>       
                <input type="button" onclick="countDown('ex-2'); exSpell(2, false)" value="-"/>
                <div>
                    <select th:field="*{exp2}" onchange="exSpell(2, true); countUp('ex-2-label')">
                        <option value=""> Select Spell to Experience</option>
                        <option value="banish">Banish</option>
                        <option value="force-barrier">Force Barrier</option>
                        <option value="heat-weapon">Heat Weapon</option>
                        <option value="mend">Mend</option>
                        <option value="shove">Shove</option>
                    </select>
                </div>     
            </div>

            <div>
                <label for="force-barrier">Force Barrier</label>
                <input type="number" id="force-barrier" class="spell-input" th:field="*{spentPoints[4]}" 
                data-cost="1" data-level="1" value="0" data-type="verbal" data-school="sorcery" data-range="self" readonly/>
                <input type="button" onclick="countUp('force-barrier')" value="+"/>        
                <input type="button" onclick="countDown('force-barrier')" value="-"/>
            </div>

             <div>
                <label for="force-bolt">Force Bolt</label>
                <input type="number" id="force-bolt" class="spell-input" th:field="*{spentPoints[5]}" 
                data-cost="1" data-limit="8" data-level="1" data-type="ball" data-school="sorcery" data-range="ball" value="0" readonly/>
                <input type="button" onclick="countUp('force-bolt')" value="+"/>        
                <input type="button" onclick="countDown('force-bolt')" value="-"/>
            </div>

             <div>
                <label for="heat-weapon">Heat Weapon</label>
                <input type="number" id="heat-weapon" class="spell-input" th:field="*{spentPoints[6]}" 
                data-cost="1" data-level="1" data-type="verbal" data-school="flame" data-range="20" value="0" readonly/>
                <input type="button" onclick="countUp('heat-weapon')" value="+"/>        
                <input type="button" onclick="countDown('heat-weapon')" value="-"/>
            </div>

             <div>
                <label for="mend">Mend</label>
                <input type="number" id="mend" class="spell-input" th:field="*{spentPoints[7]}" 
                data-cost="1" data-level="1" data-type="verbal" data-school="sorcery" data-range="touch" value="0" readonly/>
                <input type="button" onclick="countUp('mend')" value="+"/>        
                <input type="button" onclick="countDown('mend')" value="-"/>
            </div>

             <div>
                <label for="shove">Shove</label>
                <input type="number" id="shove" class="spell-input" th:field="*{spentPoints[8]}" 
                data-cost="1" data-level="1" data-type="verbal" data-school="sorcery" data-range="20" value="0" readonly/>
                <input type="button" onclick="countUp('shove')" value="+"/>        
                <input type="button" onclick="countDown('shove')" value="-"/>
            </div>

            <h1>Level 6</h1>
            <h2>Name    Purchased   Cost    Max</h2>

            <div>
                <label for="battlemage">Battlemage</label>
                <input type="number" id="battlemage" class="spell-input" th:field="*{spentPoints[44]}" 
                data-cost="2" data-limit="1" data-level="6" data-type="archtype" data-school="neutral" value="0" readonly/>
                <input type="button" onclick="setBattlemage(true)" value="+"/>        
                <input type="button" onclick="setBattlemage(false)" value="-"/>

            </div>

            <div>
                <label for="elemental-barrage">Elemental Barrage</label>
                <input type="number" id="elemental-barrage" class="spell-input" th:field="*{spentPoints[45]}" 
                data-cost="1" data-limit="2" data-level="6" data-type="verbal" data-school="sorcery" data-range="self" value="0" readonly/>
                <input type="button" onclick="countUp('elemental-barrage')" value="+"/>        
                <input type="button" onclick="countDown('elemental-barrage')" value="-"/>

            </div>

            <div>
                <label for="evoker">Evoker</label>
                <input type="number" id="evoker" class="spell-input" th:field="*{spentPoints[46]}" 
                data-cost="2" data-limit="1" data-level="6" data-type="archtype" data-school="neutral" value="0" readonly/>
                <input type="button" onclick="setEvoker(true)" value="+"/>        
                <input type="button" onclick="setEvoker(false)" value="-"/>

            </div>



            <div id="form-footer">
                <span id="reqLevel1">1:</span><input type="number" id="level1Points" name="level1Points"  class="level-input" th:field="*{pointsRemainingByLevel[0]}" value="5" size="2" disabled > 
                <span id="reqLevel2">2:</span><input type="number" id="level2Points" name="level2Points"  class="level-input" th:field="*{pointsRemainingByLevel[1]}" value="5" size="2" disabled > 
                <span id="reqLevel3">3:</span><input type="number" id="level3Points" name="level3Points"  class="level-input" th:field="*{pointsRemainingByLevel[2]}" value="5" size="2" disabled > 
                <span id="reqLevel4">4:</span><input type="number" id="level4Points" name="level4Points"  class="level-input" th:field="*{pointsRemainingByLevel[3]}" value="5" size="2" disabled > 
                <span id="reqLevel5">5:</span><input type="number" id="level5Points" name="level5Points"  class="level-input" th:field="*{pointsRemainingByLevel[4]}" value="5" size="2" disabled > 
                <span id="reqLevel6">6:</span><input type="number" id="level6Points" name="level6Points"  class="level-input" th:field="*{pointsRemainingByLevel[5]}" value="5" size="2" disabled > 
            </div>

            <div>
                <button type="submit"> Save list </button>
                <input type="button" onclick="deleteList()" value="Delete list"/>
            </div>

        </form>

        
        
        
        <script type="text/javascript" th:src="@{/js/listBuilder.js}"></script>

        <script>
            function setBattlemage(bool) {
                const spellInputs = document.querySelectorAll('.spell-input');

                if(bool) {
                
                    for(const spell of spellInputs) {
                        
                        if(spell.dataset.type == "ball" || spell.dataset.type == "enchantment") {

                            if(parseInt(spell.value) > 0) return;
                        }
                    }
                    setArchtype('battlemage');
                    countUp('battlemage');
                }
                else {
                    setArchtype('');
                    countDown('battlemage');
                }
            }



            function setEvoker(bool) {

                if(bool) {
                    const spellInputs = document.querySelectorAll('.spell-input');
                    
                    for(const spell of spellInputs) {
                        
                        if(spell.dataset.range == "20" || spell.dataset.range == "50") {

                            if(parseInt(spell.value) > 0) return;
                        }
                    }
                    countUp('evoker');
                    setArchtype('evoker');
                }
                else {
                    countDown('evoker');
                    setArchtype('');
                }

            }
        </script>
    </body>




</html>
