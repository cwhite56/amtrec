<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Wizard List</title>
        <link rel="stylesheet" th:href="@{/style.css}">

        <style>
            .spell-grid {
                display: grid;
                grid-template-columns: max-content max-content max-content max-content max-content max-content;
                border-top: 1px solid #444;
                border-left: 1px solid #444;
                width: max-content;
            }

            .spell-grid h1 {
                grid-column: 1 / -1;
                margin: 0;
                padding: 8px 10px;
                border-right: 1px solid #444;
                border-bottom: 1px solid #444;
                background: #f2f2f2;
            }

            .spell-grid .subhead {
                margin: 0;
                padding: 6px 10px;
                border-right: 1px solid #444;
                border-bottom: 1px solid #444;
                font-size: 0.85em;
                font-weight: 600;
                background: #fafafa;
                color: #555;
                display: flex;
                align-items: center;
            }

            .subhead-name { grid-column: 1; }
            .subhead-purchased { grid-column: 2 / 5; justify-content: center; }
            .subhead-cost { grid-column: 5; justify-content: center; }
            .subhead-max { grid-column: 6; justify-content: center; }

            .spell-row {
                display: contents;
            }

            .spell-row > * {
                border-right: 1px solid #444;
                border-bottom: 1px solid #444;
                padding: 4px 10px;
                margin: 0;
                display: flex;
                align-items: center;
            }

            .spell-row > *:nth-child(1) { grid-column: 1; }
            .spell-row > *:nth-child(2) { grid-column: 2; }
            .spell-row > *:nth-child(3) { grid-column: 3; }
            .spell-row > *:nth-child(4) { grid-column: 4; }
            .spell-row > *:nth-child(5) { grid-column: 5; }
            .spell-row > *:nth-child(6) { grid-column: 6; }
            .spell-row > *:nth-child(7) { grid-column: 1; }
            .spell-row > *:nth-child(8) { grid-column: 2 / -1; }

            .spell-row > label {
                justify-content: flex-start;
                white-space: nowrap;
            }

            .spell-row > input[type="number"] {
                width: 2.5em;
                text-align: center;
                justify-content: center;
            }

            .spell-row > input[type="button"] {
                justify-content: center;
                width: 2em;
                box-sizing: content-box;
            }

            .blank-cell {
                min-height: 1.6em;
                border-top: 2px solid #000;
                border-left: 2px solid #000;
            }

            .cost-cell,
            .limit-cell {
                justify-content: center;
                width: 2.5em;
                text-align: center;
            }

            .exp-select-cell {
                justify-content: flex-start;
                width: 230px;
                box-sizing: border-box;
            }

            .exp-select-cell select {
                width: 100%;
            }

            .fill-cell {
                background: #f2f2f2;
            }
        </style>
    </head>

        <script type="text/javascript" th:src="@{/js/listBuilder.js}"></script>

        <script>
            function setBattlemage(bool) {
                const spellInputs = document.querySelectorAll('.spell-input');

                if(bool) {
                
                    for(const spell of spellInputs) {
                        
                        if(spell.dataset.type == "ball" || spell.dataset.type == "enchantment") {

                            if(parseInt(spell.value) > 0) return;
                        }
                    }
                    setArchtype('battlemage');
                    countUp('battlemage');
                }
                else {
                    setArchtype('');
                    countDown('battlemage');
                }
            }



            function setEvoker(bool) {

                if(bool) {
                    const spellInputs = document.querySelectorAll('.spell-input');
                    
                    for(const spell of spellInputs) {
                        
                        if(spell.dataset.range == "20" || spell.dataset.range == "50") {

                            if(parseInt(spell.value) > 0) return;
                        }
                    }
                    countUp('evoker');
                    setArchtype('evoker');
                }
                else {
                    countDown('evoker');
                    setArchtype('');
                }

            }

            function setWarlock(bool) {

                const spellInputs = document.querySelectorAll('.spell-input');

                if(bool) {
                    
                    for(const spell of spellInputs) {
                        // check for violations
                        if(spell.dataset.school != "death" && spell.dataset.school != "flame") {

                            if(spell.dataset.type == "verbal" || spell.dataset.type == "ball") {

                                if(parseInt(spell.value) > 0) return;
                            }
                        }

                        else {
                            spell.dataset.valueMultiplier = 2;
                            spell.value *= parseInt(spell.dataset.valueMultiplier);
                        }
                    }
                    countUp('warlock');
                    setArchtype('warlock');
                }

                else {
                    for(const spell of spellInputs) {

                        if(spell.dataset.school == "death" || spell.dataset.school == "flame") {
                            spell.value /= parseInt(spell.dataset.valueMultiplier);
                            spell.dataset.valueMultiplier = 1;
                        }
                    }
                    countDown('warlock');
                    setArchtype('');
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('.spell-row').forEach(function (row) {
                    var input = row.querySelector('.spell-input');
                    if (!input) return;

                    var costCell = row.querySelector('.cost-cell');
                    var limitCell = row.querySelector('.limit-cell');

                    if (costCell) {
                        costCell.textContent = input.dataset.cost || '\u2014';
                    }
                    if (limitCell) {
                        limitCell.textContent = input.dataset.limit || '\u2014';
                    }
                });
            });
        </script>
    </body>

</html>
