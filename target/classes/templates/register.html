<!DOCTYPE HTML>

<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Register</title>
    </head>

    <body>
        <header>Please register</header>

        <form class="form" th:action="@{/api/v1/users}" th:object="${newUserRequest}" method="post">

            <div>
                <label>Username</label>
                <input type="text" th:field="*{username}" placeholder="Username" required/>
            </div>

            <div>
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Password" required/>
            </div>

                <label>Kingdom</label>
                <select th:field="*{kingdom}">
                    <option value="" disabled selected> Select Kingdom</option>
                    <option th:each="k : ${T(com.cwhite56.amtrec.domain.Kingdom).values()}"
                            th:value="${k}"
                            th:text="${k}">
                    </option>
                </select>

            <button type="submit"> Submit </button>

            <div>
                <p>Please rememeber your credentials! As this is a passion project, I do not have any password recovery designed yet.</p>
            </div>

        </form>

        <style>
            * {
                text-align: center;
                font-size: 20px;
                background-color: aliceblue;

            }
            header{
                padding-top: 100px;
            }
        </style>

        <script>

            const form = document.querySelector('.form');

            form.addEventListener('submit', event => {
                event.preventDefault();

                const formData = new FormData(form);

                const data = Object.fromEntries(formData);

                fetch('/api/v1/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)

                }).then(res => {
                    
                    if(res.status === 409) {
                        alert("Username already exists!");
                        throw new Error('Username already exists');
                        
                    }

                    else if(!res.ok) {
                        throw new Error('Could not register user');
                    }
                    return res.json();
                    
                }).then(data => {

                    window.location.href = `/`;
                });
            });
        </script>



    </body>




</html>
