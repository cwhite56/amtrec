<!DOCTYPE HTML>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Spell Lists</title>
    </head>

    <body>
        <header th:text="${username} + '\'s ' + 'Spell ' + 'Lists'"> </header>

        <div>
            <a th:href="@{/users/{username}(username = ${username})}" dashboard>
            Dashboard
            </a>
        </div>
        
        <div>
            <ul>
                <li th:each="spelllist : ${dtoList}">
                    <a th:href="@{/users/{username}/spell-lists/{title}(username = ${username}, title = ${spelllist.title})}" 
                    th:text="${spelllist.title}" Spell List Title>
                    </a>
                </li>
            </ul>
        </div>

        <div>
            <a th:href="@{/users/{username}/spell-lists(username = ${username})}">
                Create new spell list
            </a>
        </div>
    </body>




</html>
